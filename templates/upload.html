<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Upload Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container mt-5 text-center">
        <h1 class="mb-4" style="animation: fadeInDown 1s ease-out;">Upload Your Video</h1>
        <form action="/upload" method="POST" enctype="multipart/form-data" style="animation: fadeIn 1.5s ease;">
            <div class="mb-3">
                <label for="video" class="form-label">Choose an MP4 file:</label>
                <input type="file" name="video" class="form-control" accept=".mp4" required>
            </div>

            <div class="mb-3">
                <label for="lang" class="form-label">Target Language:</label>
                <select name="lang" class="form-select">
                    <option value="English">English</option>
                    <option value="Chinese" selected>Chinese</option>
                </select>
            </div>

            <button type="submit" class="btn-main">Upload & Process</button>
        </form>
    </div>
</body>
</html>
