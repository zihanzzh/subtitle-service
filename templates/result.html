<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Download Your Video</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container text-center">
        <h2 class="mb-3">Your video has been processed!</h2>
        <p class="lead">Click below to download your subtitled video:</p>

        {% if output_filename %}
            <a href="{{ url_for('download_file', filename=output_filename) }}" class="btn-main">Download MP4</a>
        {% else %}
            <div class="alert alert-danger mt-3">Sorry, we couldn't find your processed video.</div>
        {% endif %}
    </div>
</body>
</html>
